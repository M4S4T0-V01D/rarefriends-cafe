name: Check and deploy preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: touch games/rarefriends-cafe/.friendsdk/.nojekyll
      # Preview page for sharing: /preview/ with the screenshots from docs/.
      - run: mkdir -p games/rarefriends-cafe/.friendsdk/preview/img && cp site/preview/index.html games/rarefriends-cafe/.friendsdk/preview/ && cp docs/*.png games/rarefriends-cafe/.friendsdk/preview/img/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/rarefriends-cafe/.friendsdk

  deploy:
    # Public playable preview on GitHub Pages (Settings → Pages → Source: GitHub Actions).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
